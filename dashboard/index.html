<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Affiliate Agent Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .card h3 {
            margin-top: 0;
            color: #aaaaaa;
            font-size: 1em;
        }
        .card p {
            margin: 10px 0 0;
            font-size: 2em;
            font-weight: bold;
        }
        .earning-green {
            color: #4caf50;
        }
        .agents-section {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
        }
        .agent-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .agent-row:last-child {
            border-bottom: none;
        }
        .dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }
        .dot-green {
            background-color: #4caf50;
        }
        .dot-red {
            background-color: #f44336;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Affiliate System Dashboard</h1>

    <div class="card-grid">
        <div class="card">
            <h3>Today's Earnings</h3>
            <p id="today-earnings" class="earning-green">₹0</p>
        </div>
        <div class="card">
            <h3>Month's Earnings</h3>
            <p id="month-earnings" class="earning-green">₹0</p>
        </div>
        <div class="card">
            <h3>Total Reels Posted</h3>
            <p id="total-reels">0</p>
        </div>
        <div class="card">
            <h3>Today's Product</h3>
            <p id="today-product" style="font-size: 1.2em;">Loading...</p>
        </div>
    </div>

    <div class="agents-section">
        <h2>Agent Status</h2>
        <div id="agents-list">
            <!-- Populated via JS -->
        </div>
    </div>
</div>

<script>
    // USER CONFIGURATION
    const MONGO_DATA_API_URL = 'your_mongodb_data_api_url/action';
    const MONGO_DATA_API_KEY = 'your_mongodb_data_api_key';
    const DATA_SOURCE = 'your_cluster_name';
    const DATABASE = 'affiliate_agent';

    const headers = {
        'Content-Type': 'application/json',
        'Access-Control-Request-Headers': '*',
        'api-key': MONGO_DATA_API_KEY
    };

    async function callMongoAPI(action, collection, filter = {}, sort = null, limit = null, projection = null) {
        const payload = {
            dataSource: DATA_SOURCE,
            database: DATABASE,
            collection: collection,
            filter: filter
        };
        if (sort) payload.sort = sort;
        if (limit) payload.limit = limit;
        if (projection) payload.projection = projection;

        const res = await fetch(`${MONGO_DATA_API_URL}/${action}`, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(payload)
        });
        return res.json();
    }

    async function fetchData() {
        if (MONGO_DATA_API_URL === 'your_mongodb_data_api_url/action') {
            document.getElementById('today-product').innerText = 'Please configure MongoDB Data API URL and Key';
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];

        try {
            // 1. Today's Earnings
            const earningsRes = await callMongoAPI('find', 'earnings', { date: today }, null, null, { commission_inr: 1 });
            const todayTotal = (earningsRes.documents || []).reduce((acc, curr) => acc + (curr.commission_inr || 0), 0);
            document.getElementById('today-earnings').innerText = `₹${todayTotal}`;

            // 2. Month's Earnings
            const monthRes = await callMongoAPI('find', 'earnings', { date: { $gte: monthStart } }, null, null, { commission_inr: 1 });
            const monthTotal = (monthRes.documents || []).reduce((acc, curr) => acc + (curr.commission_inr || 0), 0);
            document.getElementById('month-earnings').innerText = `₹${monthTotal}`;

            // 3. Total Reels Posted
            const reelsCountRes = await callMongoAPI('aggregate', 'reels', undefined, undefined, undefined, undefined);
            // using find since count isn't standard in basic Data API endpoints, pulling ids to count
            const reelsRes = await callMongoAPI('find', 'reels', { status: 'posted' }, null, null, { _id: 1 });
            document.getElementById('total-reels').innerText = (reelsRes.documents || []).length;

            // 4. Today's Product
            const todayStart = new Date();
            todayStart.setUTCHours(0,0,0,0);

            const todayReelRes = await callMongoAPI('find', 'reels', { status: 'posted', posted_at: { $gte: { "$date": todayStart.toISOString() } } });

            if (todayReelRes.documents && todayReelRes.documents.length > 0) {
                const productId = todayReelRes.documents[0].product_id;
                const productRes = await callMongoAPI('findOne', 'products', { id: productId });
                if(productRes.document) {
                    document.getElementById('today-product').innerText = productRes.document.name;
                }
            } else {
                document.getElementById('today-product').innerText = 'None yet';
            }

            // 5. Agent Status
            const agents = ['research_agent', 'content_agent', 'post_agent', 'track_agent'];
            const agentsListHtml = [];
            const now = new Date();

            for (const agent of agents) {
                const logsRes = await callMongoAPI('find', 'agent_logs', { agent_name: agent }, { created_at: -1 }, 1);

                let dotClass = 'dot-red';
                let lastRunText = 'Never';

                if (logsRes.documents && logsRes.documents.length > 0) {
                    // Handle MongoDB Data API date format
                    const dateStr = logsRes.documents[0].created_at.$date || logsRes.documents[0].created_at;
                    const lastRun = new Date(dateStr);
                    lastRunText = lastRun.toLocaleString();

                    // Check if run within last 2 hours
                    const diffHours = (now - lastRun) / (1000 * 60 * 60);
                    if (diffHours < 2) {
                        dotClass = 'dot-green';
                    }
                }

                agentsListHtml.push(`
                    <div class="agent-row">
                        <div>
                            <span class="dot ${dotClass}"></span>
                            <strong>${agent.replace('_', ' ').toUpperCase()}</strong>
                        </div>
                        <div>Last run: ${lastRunText}</div>
                    </div>
                `);
            }

            document.getElementById('agents-list').innerHTML = agentsListHtml.join('');

        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('today-product').innerText = 'Error loading data';
        }
    }

    fetchData();
    // Refresh every 5 minutes
    setInterval(fetchData, 5 * 60 * 1000);

</script>

</body>
</html>
